# pnpm's settings, which do not live in package.json any more.
#
# They were in package.json's "pnpm" field and stopped being read: the tool printed "The
# pnpm field in package.json is no longer read" on every command, which meant the only
# real control here -- what may run an install script -- had quietly stopped applying.
#
# The key has moved twice. pnpm 10 called it `onlyBuiltDependencies`, a list; pnpm 11
# calls it `allowBuilds`, a map with an explicit true or false per package. Writing the
# older name here is not an error and not a warning: the install simply fails with
# ERR_PNPM_IGNORED_BUILDS, which is how this was found -- in the first deployment.

# A postinstall is where a compromised dependency runs first, before anything is built or
# tested. Every one is blocked unless it appears here, and pnpm fails the install rather
# than warn, because a skipped build is a decision somebody has to make.
#
# esbuild is the only package in this tree with a script at all, and it does not need it:
# since 0.25 the platform binary arrives as an optional dependency (@esbuild/linux-x64 on
# the runner, @esbuild/win32-x64 on a Windows laptop) and the script is a legacy fallback
# that verifies what is already there. Checked with it skipped: `transformSync` works and
# `pnpm build` produces dist-server.
#
# So: false, deliberately. Nothing runs an install script, and the next dependency that
# brings one turns the install red until a person decides, rather than slipping through
# because an earlier entry had opened the door.
allowBuilds:
  esbuild: false

# Transitive versions pinned above their advisories, each compatible with what its parent
# asks for but glob, and one dependency nothing runs removed.
#
# qs is what express parses every query string with, before a single line of this project
# sees the request -- 6.15.3 carries a denial of service and an array-limit bypass, and
# express asks for ^6.14.0, so 6.16 is a patch away rather than a leap. fast-uri arrives
# under ajv inside workbox-build, which only ever reads our own files at build time, but
# there is no reason to ship a known-bad version to anyone who clones this.
#
# Drop an entry once its parent asks for a fixed version by itself.
overrides:
  # 6.16.1 since GHSA-6pq8-jhm2-2vcw; capped at the major express asks for, like fast-uri below.
  qs: '>=6.16.1 <7'
  # Upper bound on purpose: an open `>=3.1.6` resolved to 4.1.4, and ajv asks for ^3.0.1.
  # An override is allowed to ignore that, which is exactly how a security fix becomes an
  # outage. Patched, and still inside the range its parent was written against. 3.1.9 since
  # GHSA-wjr9-j795-jxcr and the three published with it; 3.1.8 since GHSA-hrr3-gc8f-f4qj.
  fast-uri: '>=3.1.9 <4'
  # brace-expansion arrives under minimatch, through glob inside workbox-build, reading only our
  # own glob patterns at build time. GHSA-q2hr-2g5m-vwhr and the two before it; pinned inside
  # the major its parent asks for. The 2.x copy left with jake, below.
  brace-expansion@5: '>=5.0.12 <6'
  # jake, and filelist and minimatch 5 under it, are for ejs's command line, which nothing here
  # runs: the ejs library that workbox-build's off-main-thread plugin loads requires only fs,
  # path and its own files. Removed, and minimatch 5's GHSA-g3hv-75wg-m249 with it.
  'ejs>jake': '-'
  # Under @rollup/plugin-terser inside workbox-build, which asks for ^7.0.3; it writes our own
  # service-worker config at build time. GHSA-m5mm-p8h7-m29v.
  serialize-javascript: '>=7.1.3 <8'
  # The one override past its parent's major, on purpose: workbox-build 7.4.1, its latest, asks
  # for ^11, which glob's author has deprecated, and the fix for GHSA-3g3m-2fjr-6pw4 is only in
  # 14. workbox calls nothing but `globSync`, and the built service worker precaches the same
  # files with the same revisions under 14 as under 11. glob 14 also brings minimatch 11, past
  # GHSA-g3hv-75wg-m249. Drop it once workbox-build asks for 14 itself.
  glob: '>=14.0.2 <15'
