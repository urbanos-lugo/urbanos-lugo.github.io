name: Deploy the API worker

# The two endpoints a static host cannot serve: the operator's service notices and the
# minutes their own page shows behind a pole's QR. Neither site sends a CORS header, so a
# browser is refused and something with a server has to ask for it.
#
# It only exists if somebody deploys it. Without it the site is exactly what it is today:
# the notices come from the copy the hourly job commits, and the QR block does not appear.
# So the job does nothing at all until its token is set, as a secret of its environment
# below — no red runs on a repository that has decided not to bother.
#
# It ran on Deno Deploy until November 2026. Deno Deploy announced on 9 October 2026 that it
# shuts down six months on, so the same bundle went to Cloudflare Workers, the site was
# pointed there through the API_ORIGIN variable, and the Deno job left once nothing asked it.
on:
  push:
    branches: [main]
    # Only when something it is made of changed. The app's own screens are Pages' business.
    paths:
      - 'worker/**'
      - 'src/services/**'
      - 'src/data/**'
      - 'src/utils/**'
      - 'src/i18n/**'
      - 'src/project.ts'
      - 'wrangler.toml'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

# Read the tree, and nothing more. The deploy authenticates with the CLOUDFLARE_API_TOKEN
# secret and asks for no id-token; a token nobody uses is a token a compromised step could
# mint.
permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: true

jobs:
  cloudflare:
    runs-on: ubuntu-24.04
    # Where the token lives: a secret of this environment, which Settings → Environments
    # lets only main deploy from, so a run from any other branch is refused before it starts.
    environment: cloudflare
    env:
      # Read here and not in the step's `if`: the secrets context is available to a job's
      # env and not to a step's condition, where it would quietly evaluate to nothing and
      # skip the deploy on a repository that had configured one.
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - run: pnpm install --frozen-lockfile

      # The same gate the site gets. A worker that answers with a dataset contradicting
      # itself is worse than one that is not there, because the app has a fallback for
      # absent and none for wrong.
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm run worker:build

      # wrangler.toml says what goes up: the bundle just built, as it is. wrangler is fetched
      # here at an exact version rather than kept in the lockfile, where its runtime binary
      # would be installed by every other job for this one step. It runs with the token, so
      # it is a release more than two weeks old, moved on purpose.
      #
      # The origin is derived from the repository owner, so a fork is not left answering for
      # this one; the commit is what /api/version reports. Both go in on every deploy, and
      # wrangler drops any variable a deploy does not name.
      #
      # The account needs its workers.dev subdomain chosen once in the dashboard (Workers &
      # Pages) before the first deploy: wrangler asks for one otherwise, and with no terminal
      # to ask in, fails.
      - name: Deploy
        if: env.HAS_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          # Nothing about this deploy goes to Cloudflare's usage statistics.
          WRANGLER_SEND_METRICS: 'false'
        run: |
          pnpm dlx wrangler@4.158.0 deploy \
            --var "ALLOWED_ORIGIN:https://${GITHUB_REPOSITORY_OWNER}.github.io" \
            --var "DEPLOY_SHA:${GITHUB_SHA}"

      - name: Say why nothing was deployed
        if: env.HAS_TOKEN != 'true'
        run: |
          echo "No CLOUDFLARE_API_TOKEN secret in the cloudflare environment, so nothing went"
          echo "to Cloudflare Workers. README, 'Devolverlle a Pages as dúas cousas que lle faltan'."
