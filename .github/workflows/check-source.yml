name: Check the sources

# The dataset is a scrape, and a scrape drifts: the operator moves a pole, renames a
# stop, changes a departure. Nothing inside the app can notice that on its own — it goes
# on serving last year's timetable perfectly confidently, which is the failure this
# project cares about most.
#
# So once a week this re-reads the 24 line pages straight from buslugo.com and compares
# them against what the repository ships. A disagreement fails the run, which is the one
# thing worth interrupting somebody for: it means a route or a timetable changed and the
# data has to be regenerated.
#
# Deliberately not the 1186 stop pages. Poles move rarely and that pass takes twenty
# minutes of somebody else's bandwidth; `--fresh-stops` exists for when one is suspected
# of having moved.
#
# The same run also re-reads the map. The trazado was lifted from OpenStreetMap once and
# then never looked at again, which made it the one part of this dataset that could go
# stale in silence: a new roundabout, a street turned one-way, a corner redrawn, and the
# app goes on drawing last year's line over the new city. Two Overpass requests answer it.
on:
  schedule:
    - cron: '23 5 * * 1' # Mondays, early, off the hour to avoid the busiest minute
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-source
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      # As in the deploy workflow: without this the token stays in .git/config for every
      # later step, where a compromised dependency's install script could read it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # No version pinned here: the action reads `packageManager` from package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - run: pnpm install --frozen-lockfile

      # Around 30 seconds and 24 requests, once a week, with a User-Agent that says who
      # is asking and links back here.
      #
      # Two of the passes in that report are local-only and say so in the output: the
      # per-stop coordinate check needs .cache/official (1186 pages, twenty-odd minutes)
      # and the OpenStreetMap survey check needs .cache/osm-stops.json. Neither directory
      # is tracked, so neither runs here — deliberately. What runs is what drifts:
      # itineraries, stop names, the lines each pole badges, and the timetables.
      - name: Re-read the line pages and compare
        run: pnpm exec tsx tools/reconcile.ts --fresh

      # Every check runs even when an earlier one fails: they watch independent things,
      # and finding one broken is no reason to stop looking at the others.
      - name: Re-read the mapped routes and compare
        if: always()
        run: pnpm exec tsx tools/checkOsmGeometry.ts

      # One request. The fares are the only figure here somebody might act on with money
      # in their hand, and a rise is announced once and then never again.
      - name: Re-read the fares and compare
        if: always()
        run: pnpm exec tsx tools/checkFares.ts

      # Four to six requests. The pole pages and the council's feed, read the way the server
      # reads them, checked for the two things that drift without anyone changing a line
      # here: that the capped read still returns the whole page, and that the parsers still
      # find departures at a busy pole in service hours (one of three, since a pole lists only
      # the buses on their way that minute). It was a gate on every push; a check that needs
      # somebody else's server is a weekly check.
      - name: Re-read the pole page and the feed through the parsers
        if: always()
        run: pnpm run check:parsers

      # Nothing merges without the five gates (CLAUDE.md), and what holds main to that is a
      # GitHub ruleset, which a settings page can switch off without a commit. Three reads of
      # this repository's own rules: main still requires the Checks job, and neither main
      # nor develop can be force-pushed or deleted.
      - name: Main still requires the checks, and neither branch can be rewritten
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gated=$(gh api "repos/$REPO/rules/branches/main" --jq 'any(.[]; .type == "required_status_checks" and any(.parameters.required_status_checks[]; .context == "checks"))')
          [ "$gated" = true ] || { echo "main no longer requires the Checks job"; exit 1; }
          for branch in main develop; do
            locked=$(gh api "repos/$REPO/rules/branches/$branch" --jq 'any(.[]; .type == "non_fast_forward") and any(.[]; .type == "deletion")')
            [ "$locked" = true ] || { echo "$branch can be force-pushed or deleted"; exit 1; }
          done

      # The holidays file runs out on 1 January, and the suite fails that morning with the
      # hourly Pages build behind it. From November this fails every Monday instead, while
      # the DOG can still be read. No request: it reads the file.
      - name: Next year's holidays are in before January
        if: always()
        run: pnpm exec tsx tools/checkHolidaysAhead.ts

      # The structural notices on Avisos are written by hand; two of three had gone wrong
      # when they were last read after seven weeks. Over five weeks, this fails. No request.
      - name: The structural notices were reviewed in the last five weeks
        if: always()
        run: pnpm exec tsx tools/checkNoticesReviewed.ts
