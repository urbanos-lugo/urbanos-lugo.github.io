<!doctype html>
<!-- Dark is the default, so the class ships with the page: no white frame while the
     bundle loads, and it still holds with JavaScript off. theme-init.js below undoes
     it for the two choices that get stored. -->
<html lang="gl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Urbanos de Lugo | Bus urbano: liñas, horarios e paradas</title>
    <!-- "Non oficial" leads, because this is the one line a search result or a link
         preview shows, and it used to open with "Horarios oficiais". Under 160 characters
         so it is shown whole; tools/test.ts holds both. -->
    <meta name="description" content="Non oficial. Liñas, horarios e paradas do autobús urbano de Lugo, cos horarios de buslugo.com e estimacións sempre etiquetadas. Esta rede non publica GPS." />
    <!-- Search Console's proof that the site's owner is who asked to see its index reports.
         A public token, not a credential: it sits in the HTML of every verified site. Google
         re-checks it now and then, so losing this line quietly ends the verification. -->
    <meta name="google-site-verification" content="Wt5jZUW234gvZKEcA2sukjAO9K2aMHmHLh56Qdzc5Kc" />
    <!-- A Mosqueira: the only one of the wall's 72 surviving towers that still keeps its
         upper storey, and its two round-arch windows are the whole of the recognition. The
         wall walk crosses the badge with a stop sitting on it.

         One file rather than an inline data URI: the same mark is already shipped for the
         manifest and precached by the service worker, and two copies of a logo drift. -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <!-- The same mark as a raster for search results, which want a multiple of 48 px; the
         manifest's 192 px icon, and favicon.ico wraps it, so neither is another drawing. -->
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%icon-192.png" />
    <script src="%BASE_URL%theme-init.js"></script>

    <meta name="theme-color" content="#d81f26" />

    <!-- The app has a "copy link" button on every stop, so those links get shared. Without
         these the preview is a bare URL. The og:image is added at build, where the absolute
         address it needs is known: the 512 px icon the manifest already ships. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Urbanos de Lugo" />
    <meta property="og:title" content="Urbanos de Lugo | Bus urbano: liñas, horarios e paradas" />
    <meta property="og:description" content="Non oficial. Liñas, horarios e paradas do autobús urbano de Lugo, cos horarios de buslugo.com e estimacións sempre etiquetadas. Esta rede non publica GPS." />
    <meta property="og:locale" content="gl_ES" />
    <meta property="og:locale:alternate" content="es_ES" />
    <meta property="og:locale:alternate" content="en_GB" />
    <meta name="twitter:card" content="summary" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- No <link> to a font CDN. The faces are declared in src/fonts.css and served from
         this origin, so the only hosts a visitor's browser contacts are the map's — see
         PRIVACY.md. That also removes two DNS lookups and two TLS handshakes from the
         critical path, which is a smaller win than it sounds but not nothing on a phone
         at a bus stop. -->
  </head>
  <body class="bg-bg text-ink antialiased selection:bg-accent selection:text-on-accent">
    <!-- The page's heading before any script runs. React replaces everything inside #root
         on mount with its own sr-only <h1> per screen, so nothing doubles; but a crawler
         that does not run JavaScript -- Bing's site scan reported "H1 tag missing" -- sees
         the document as it arrives, and each per-tab copy carries its own title here.
         Hidden the same way the app hides it, so it takes no space and never flashes. -->
    <div id="root"><h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">Urbanos de Lugo | Bus urbano: liñas, horarios e paradas</h1></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
